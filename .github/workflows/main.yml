name: 🤖 每日樂透資料自動抓取與備份排程

on:
  schedule:
    # 💡 每天晚上 11 點 (台灣時間) 自動執行 -> UTC 時間為 15 點
    - cron: '0 15 * * *'
  workflow_dispatch: # 允許在 GitHub 頁面上手動觸發測試

jobs:
  fetch_and_update:
    runs-on: ubuntu-latest
    
    # 給予機器人寫入倉庫的權限，才能成功 Push
    permissions:
      contents: write

    steps:
      - name: 📥 1. 取得最新程式碼 (Checkout)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 抓取完整歷史紀錄以便後續 commit
          
      - name: 🐍 2. 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: 📦 3. 安裝必要套件 (Dependencies)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # 確保 pandas 與 requests 被安裝 (若 requirements 沒有涵蓋)
          pip install pandas requests

      - name: 🚀 4. 執行爬蟲腳本抓取最新樂透資料
        run: |
          python fetch_data.py
          
      - name: 💾 5. 將更新後的資料庫 Commit 並 Push 回倉庫
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 檢查 lottery_data.db 是否有變更
          if git diff --quiet lottery_data.db; then
            echo "✅ 今天沒有新的開獎資料，無需 Commit。"
          else
            git add lottery_data.db
            git commit -m "🤖 自動更新樂透資料庫 [$(date +'%Y-%m-%d')]"
            git push
            echo "🎉 成功寫入新資料並 Push 至 GitHub 倉庫！"
          fi
