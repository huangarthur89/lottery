name: 🤖 每日樂透資料自動抓取與備份排程

on:
  schedule:
    # 💡 每天晚上 11 點 (台灣時間) 自動執行 -> UTC 時間為 15 點
    - cron: '0 15 * * *'
  workflow_dispatch: # 允許在 GitHub 頁面上手動觸發測試

jobs:
  fetch_and_update:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: 📥 1. 取得最新程式碼 (Checkout)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 
          
      - name: 🐍 2. 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: 📦 3. 安裝必要套件 (Dependencies)
        run: |
          python -m pip install --upgrade pip
          # 進入資料夾安裝套件
          if [ -f 命盤樂透/requirements.txt ]; then pip install -r 命盤樂透/requirements.txt; fi
          pip install pandas requests

      - name: 🚀 4. 執行爬蟲腳本抓取最新樂透資料
        run: |
          # 告訴機器人先走進資料夾再執行
          cd 命盤樂透
          python fetch_data.py
          
      - name: 💾 5. 將更新後的資料庫 Commit 並 Push 回倉庫
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 指定檢查並上傳 命盤樂透 資料夾內的資料庫
          if git diff --quiet 命盤樂透/lottery_data.db; then
            echo "✅ 今天沒有新的開獎資料，無需 Commit。"
          else
            git add 命盤樂透/lottery_data.db
            git commit -m "🤖 自動更新樂透資料庫 [$(date +'%Y-%m-%d')]"
            git push
            echo "🎉 成功寫入新資料並 Push 至 GitHub 倉庫！"
          fi
